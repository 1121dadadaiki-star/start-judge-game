function newScenario(){
 // Each heat is independent: no progression-based difficulty or fixed quota.
 const early=Math.random()<.5;
 const lane=Math.floor(Math.random()*8)+1;
 // Faulting athlete begins anywhere from 300 ms before to 95 ms after the gun.
 const faultStart=-.300+Math.random()*.395;
 // All other athletes start at least 100 ms after the gun.
 const delays=Array.from({length:8},()=>.100+Math.random()*.200);
 scenario={early,lane,faultStart,delays};
}

function initHeat(){watchToken++;cancelAnimationFrame(animId);newScenario();show('game');$('heat').textContent=`${heat}組目 / ${max}`;$('difficulty').textContent=mode.toUpperCase();$('racePrompt').textContent='スタートの準備ができました';$('racePrompt').classList.remove('hidden');$('decisionLayer').classList.add('hidden');$('answers').classList.remove('hidden');$('prompt').textContent='あなたの判定は？';$('watch').classList.remove('hidden');$('watch').disabled=false;$('laneChoices').classList.add('hidden');paint(Array(8).fill(0));}
function watch(){
 let token=++watchToken;
 $('watch').disabled=true;$('watch').classList.add('hidden');
 $('racePrompt').textContent='スタートを確認してください';
 // Audio and movement share the same media clock, avoiding independent timer drift.
 if(startAudio){startAudio.pause();startAudio=null;}
 let media=new Audio(START_AUDIO);startAudio=media;media.preload='auto';media.volume=audioOn?1:0;
 let begun=performance.now(),audioStarted=false,ended=false,freezeAt=0;
 const finishVideo=()=>{if(token!==watchToken||ended)return;ended=true;$('racePrompt').classList.add('hidden');$('decisionLayer').classList.remove('hidden');$('answers').classList.remove('hidden')};
 function loop(now){
   if(token!==watchToken)return;
   let t=audioStarted?media.currentTime:(now-begun)/1000;
   let pos=Array(8).fill(0);
   for(let i=0;i<8;i++){
     const begin=(scenario.early&&i+1===scenario.lane)?scenario.faultStart:scenario.delays[i];
     pos[i]=Math.max(0,Math.min(2.8,(t-GUN_AT-begin)*3.2));
   }
   paint(pos);
   if(t>=GUN_AT+1.4||media.ended){finishVideo();return;}
   animId=requestAnimationFrame(loop);
 }
 media.addEventListener('playing',()=>{audioStarted=true;begun=performance.now();});
 media.addEventListener('error',()=>{$('racePrompt').textContent='音声を再生できません。ブラウザで開いてください。';});

 animId=requestAnimationFrame(loop);
}
function answer(isFault,lane){if(state!=='game')return;if(isFault&&mode==='hard'&&lane===undefined){$('answers').classList.add('hidden');$('prompt').textContent='フライングしたレーンを選択';$('laneChoices').classList.remove('hidden');return}let win=scenario.early?(isFault&&(mode==='normal'||lane===scenario.lane)):!isFault;if(win)correct++;$('feedbackIcon').textContent=win?'✓':'✕';$('feedbackIcon').style.color=win?'#6be7bc':'#ff9999';$('feedbackTitle').textContent=win?'正解！':'判定ミス';$('feedbackText').textContent=win?`${heat}組目の判定に成功！\n${correct}組連続正解中。`:`正解：${scenario.early?`フライングあり（${scenario.lane}レーン）`:'正常スタート'}。\n${correct}組連続正解で終了。`;show('feedback');$('continue').textContent=win?(heat===max?'大会結果を見る →':'次の組へ →'):'結果を見る →';$('continue').onclick=()=>{if(!win||heat===max){finish(win&&heat===max)}else{heat++;initHeat()}};}
function finish(perfect){show('end');$('endTitle').textContent=perfect?'PERFECT CLEAR!':'GAME OVER';$('endText').textContent=perfect?`30組すべてのスタートを正しく判定しました！\n${mode.toUpperCase()} MODE 完全制覇！`:`${heat}組目で判定ミス。\n${correct}組連続正解！\n難易度：${mode.toUpperCase()}`;}
$('normal').onclick=()=>pick('normal');$('hard').onclick=()=>pick('hard');$('go').onclick=()=>{heat=1;correct=0;initHeat()};$('watch').onclick=watch;$('clean').onclick=()=>answer(false);$('fault').onclick=()=>answer(true);$('again').onclick=()=>{watchToken++;if(startAudio){startAudio.pause();startAudio=null;}show('menu')};for(let i=1;i<=8;i++){let b=document.createElement('button');b.className='lane';b.textContent=i+'レーン';b.onclick=()=>answer(true,i);$('laneChoices').appendChild(b)}function soundToggle(){audioOn=!audioOn;if(startAudio)startAudio.volume=audioOn?1:0;$('soundMenu').textContent=audioOn?'🔊 音 ON':'🔇 音 OFF';$('soundGame').textContent=audioOn?'🔊':'🔇';if(audioOn)tone(750)}$('soundMenu').onclick=soundToggle;$('soundGame').onclick=soundToggle;window.addEventListener('resize',background);background();
})();
</script></body></html>
