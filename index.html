function newScenario(){
 // No difficulty ramp: every heat is independently randomized.
 const early=Math.random()<.5;
 const lane=Math.floor(Math.random()*8)+1;
 // Most faults are extremely close to the 100 ms threshold; some are just before the gun.
 const r=Math.random();
 const faultStart=r<.78 ? (.072+Math.random()*.027) : (r<.94 ? (.015+Math.random()*.057) : (-.075+Math.random()*.090));
 // Normal starters can be close to the threshold too, so position alone cannot reveal a fault.
 const delays=Array.from({length:8},()=>.100+Math.pow(Math.random(),1.8)*.075);
 // Independently assigned acceleration and top speed; a faulting runner can be overtaken.
 const speeds=Array.from({length:8},()=>.72+Math.random()*.68);
 const acceleration=Array.from({length:8},()=>.70+Math.random()*.65);
 // Make the false starter somewhat more likely to be slower, without making it a reliable cue.
 if(early && Math.random()<.70){speeds[lane-1]=.70+Math.random()*.22;acceleration[lane-1]=.72+Math.random()*.20;}
 scenario={early,lane,faultStart,delays,speeds,acceleration};
}

 if(isReplay){show('game');$('decisionLayer').classList.add('hidden');$('racePrompt').classList.remove('hidden');$('watch').classList.add('hidden');}
 let token=++watchToken;
 $('watch').disabled=true;$('watch').classList.add('hidden');
 $('racePrompt').textContent='スタートを確認してください';
 // Audio and movement share the same media clock, avoiding independent timer drift.
 if(startAudio){startAudio.pause();startAudio=null;}
 let media=new Audio(START_AUDIO);startAudio=media;media.preload='auto';media.volume=audioOn?1:0;
 let begun=performance.now(),audioStarted=false,ended=false,freezeAt=0,lastMediaTime=0,endedAt=0;
 const finishVideo=()=>{if(token!==watchToken||ended)return;ended=true;media.pause();$('racePrompt').classList.add('hidden');if(isReplay){show('feedback');}else{$('decisionLayer').classList.remove('hidden');$('answers').classList.remove('hidden');}};
 function loop(now){
   if(token!==watchToken)return;
   let t=audioStarted?media.currentTime:(now-begun)/1000;
   if(media.ended){if(!endedAt){endedAt=now;lastMediaTime=media.currentTime;}t=lastMediaTime+(now-endedAt)/1000;}
   let pos=Array(8).fill(0);
   for(let i=0;i<8;i++){
     const begin=(scenario.early&&i+1===scenario.lane)?scenario.faultStart:scenario.delays[i];
     const elapsed=Math.max(0,t-GUN_AT-begin);
     // Independent start acceleration and running speed prevent identifying a fault by who leads.
     pos[i]=3.2*scenario.speeds[i]*(elapsed - (1-Math.exp(-elapsed*6*scenario.acceleration[i]))/(6*scenario.acceleration[i]) + elapsed*.30);
   }
   paint(pos);
   if(t>=GUN_AT+3.65){finishVideo();return;}
   animId=requestAnimationFrame(loop);
 }
 media.addEventListener('playing',()=>{audioStarted=true;begun=performance.now();});
 media.addEventListener('error',()=>{$('racePrompt').textContent='音声を再生できません。ブラウザで開いてください。';});
 media.play().then(()=>{audioStarted=true;}).catch(()=>{$('racePrompt').textContent='音声が再生できません。Safariで開いてください。';$('watch').classList.remove('hidden');$('watch').disabled=false;watchToken++;});
 animId=requestAnimationFrame(loop);
}
function answer(isFault,lane){if(state!=='game')return;if(isFault&&mode==='hard'&&lane===undefined){$('answers').classList.add('hidden');$('prompt').textContent='フライングしたレーンを選択';$('laneChoices').classList.remove('hidden');return}let win=scenario.early?(isFault&&(mode==='normal'||lane===scenario.lane)):!isFault;if(win)correct++;$('replay').classList.toggle('hidden',win);$('feedbackIcon').textContent=win?'✓':'✕';$('feedbackIcon').style.color=win?'#6be7bc':'#ff9999';$('feedbackTitle').textContent=win?'正解！':'判定ミス';$('feedbackText').textContent=win?`${heat}組目の判定に成功！\n${correct}組連続正解中。`:`正解：${scenario.early?`フライングあり（${scenario.lane}レーン）`:'正常スタート'}。\n${correct}組連続正解で終了。`;show('feedback');$('continue').textContent=win?(heat===max?'大会結果を見る →':'次の組へ →'):'結果を見る →';$('continue').onclick=()=>{if(!win||heat===max){finish(win&&heat===max)}else{heat++;initHeat()}};}
function finish(perfect){show('end');$('endTitle').textContent=perfect?'PERFECT CLEAR!':'GAME OVER';$('endText').textContent=perfect?`30組すべてのスタートを正しく判定しました！\n${mode.toUpperCase()} MODE 完全制覇！`:`${heat}組目で判定ミス。\n${correct}組連続正解！\n難易度：${mode.toUpperCase()}`;}
$('normal').onclick=()=>pick('normal');$('hard').onclick=()=>pick('hard');$('go').onclick=()=>{heat=1;correct=0;initHeat()};$('watch').onclick=()=>watch(false);$('replay').onclick=()=>watch(true);$('clean').onclick=()=>answer(false);$('fault').onclick=()=>answer(true);$('again').onclick=()=>{watchToken++;if(startAudio){startAudio.pause();startAudio=null;}show('menu')};for(let i=1;i<=8;i++){let b=document.createElement('button');b.className='lane';b.textContent=i+'レーン';b.onclick=()=>answer(true,i);$('laneChoices').appendChild(b)}function soundToggle(){audioOn=!audioOn;if(startAudio)startAudio.volume=audioOn?1:0;$('soundMenu').textContent=audioOn?'🔊 音 ON':'🔇 音 OFF';$('soundGame').textContent=audioOn?'🔊':'🔇';if(audioOn)tone(750)}$('soundMenu').onclick=soundToggle;$('soundGame').onclick=soundToggle;window.addEventListener('resize',background);background();
})();
</script></body></html>
