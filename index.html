<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#102c40"><title>START JUDGE PRO</title><style>
*{box-sizing:border-box}body{margin:0;background:#081a28;color:#f4f8ff;font-family:system-ui,-apple-system,'Helvetica Neue',sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}#app{min-height:100dvh;max-width:900px;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#74b9e3 0%,#9ed4e9 29%,#345b67 29%,#24434b 41%,#b44c46 42%,#9b433f 90%)}#track{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#veil{position:absolute;inset:0;background:linear-gradient(180deg,#0a294a99,#101d3bbb 45%,#121b32d9);backdrop-filter:blur(3px)}.screen{position:relative;z-index:2;min-height:100dvh;padding:24px 18px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}.hidden{display:none!important}.logo{font-size:clamp(2.2rem,9vw,4.5rem);font-style:italic;font-weight:1000;letter-spacing:-.055em;line-height:.99;text-shadow:0 5px 14px #0008;text-align:center;white-space:nowrap}.logo b{display:block;color:#f6cf72;font-size:1.15em;text-shadow:0 4px 12px #0008}.intro{text-align:center;font-size:clamp(.91rem,3.8vw,1.15rem);line-height:1.8;font-weight:700;text-shadow:0 2px 5px #0008}.mode{width:min(100%,480px);padding:19px 18px;border-radius:17px;border:2px solid #4be0ca;background:#065d60ce;color:white;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 10px 25px #0004}.mode.hard{background:#72353fcf;border-color:#ff8890}.mode strong{font-size:1.32rem;font-style:italic}.mode small{display:block;font-size:.72rem;margin-top:5px;font-weight:500}.mode .symbol{font-size:2rem}.mode.selected{outline:3px solid #fff9;transform:scale(1.015)}.gold{border:0;background:linear-gradient(#ffe59b,#d5aa54);color:#172a3a;font-weight:900;border-radius:999px;padding:16px 26px;min-height:55px;font-size:1.2rem;box-shadow:0 5px 0 #94723d}.gold:disabled{opacity:.5}.muted{color:#d3e2e9;font-size:.83rem;text-align:center}.top{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px}.pill{background:#102b40c9;border:1px solid #ffffff40;border-radius:12px;padding:10px 14px;font-weight:800}#app.playing #veil{display:none}.game{position:absolute;inset:0;min-height:100dvh;padding:0;display:block;background:transparent}.game .top{position:absolute;z-index:5;top:calc(12px + env(safe-area-inset-top));left:12px;width:calc(100% - 24px)}.game .video{position:absolute;inset:0;width:100%;height:100%;max-width:none;border:0;border-radius:0;box-shadow:none}.game .video canvas{width:100%;height:100%;object-fit:cover}.game .banner{position:absolute;z-index:5;top:calc(75px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(90%,500px)}.game #watch{position:absolute;z-index:5;bottom:calc(12% + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%)}.game .notice{display:none}.decision-overlay{position:absolute;inset:0;z-index:6;background:#071b30a6;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;padding:24px 18px}.decision-overlay .banner{position:static;transform:none;width:min(100%,540px);font-size:1.25rem}.decision-overlay .actions{width:min(100%,540px)}.decision-overlay .lanes{width:min(100%,540px)}.game #decisionLayer.hidden{display:none!important}.sound-warning{background:#fff0ba;color:#493408;border-radius:12px;padding:11px 16px;text-align:center;font-weight:900;font-size:.95rem}.video{width:100%;position:relative;border:2px solid #64869a;border-radius:13px;overflow:hidden;box-shadow:0 12px 30px #0005}.video canvas{width:100%;display:block;background:#30495a}.banner{background:#091d2ae0;border:1px solid #46677c;padding:12px 14px;border-radius:12px;text-align:center;width:100%;font-weight:700}.actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{border:2px solid #668aa1;background:#1a3b51;color:#fff;border-radius:13px;padding:16px 6px;font-weight:850;min-height:62px}.answer:disabled{opacity:.4}.answer.good{border-color:#5be4b8}.answer.bad{border-color:#ff8585}.lanes{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.lane{padding:15px 2px;background:#23455c;color:white;border:1px solid #7394a7;border-radius:11px;font-weight:850}.resultbox{width:min(100%,520px);padding:24px 18px;background:#0c263bdc;border:1px solid #7494a5;border-radius:20px;text-align:center}.resultbox h1{font-size:2.1rem;margin:8px 0}.resultbox p{line-height:1.7}.bottom{margin-top:auto}.sound{border:1px solid #8ea7b8;border-radius:999px;background:#17394a;color:white;padding:10px 13px}.notice{font-size:.75rem;line-height:1.5;color:#d4e1ea;text-align:center;max-width:500px}@media(min-width:650px){.screen{padding:32px}.actions,.lanes,.banner{max-width:650px}}
</style></head><body><div id="app"><canvas id="track"></canvas><div id="veil"></div>
<section id="menu" class="screen"><div class="logo">START JUDGE<b>PRO ⚡</b></div><div class="intro">あなたは陸上競技、100mの審判です。<br>正確な判断を心がけてください。</div><button class="mode selected" id="normal"><span class="symbol">◇</span><span><strong>NORMAL MODE</strong><small>フライングの有無を判定する</small></span><span>›</span></button><button class="mode hard" id="hard"><span class="symbol">◎</span><span><strong>HARD MODE</strong><small>フライングしたレーンを特定する</small></span><span>›</span></button><div class="sound-warning">🔊 ※音量をONにしてプレイしてください！</div><button id="go" class="gold" style="width:min(100%,480px)">▶ GAME START</button><div class="muted">最大30組 · 判定は一度だけ · リプレイなし</div><button class="sound" id="soundMenu">🔊 音 ON</button></section>
<section id="game" class="screen game hidden"><div class="video"><canvas id="race" width="900" height="1600"></canvas></div><div class="top"><span id="heat" class="pill">1組目 / 30</span><span id="difficulty" class="pill">NORMAL</span><button class="sound" id="soundGame">🔊</button></div><div id="racePrompt" class="banner">スタートの準備ができました</div><button class="gold" id="watch" style="width:min(86%,450px)">▶ スタートを見る</button><div id="decisionLayer" class="decision-overlay hidden"><div id="prompt" class="banner">あなたの判定は？</div><div id="answers" class="actions"><button id="clean" class="answer good">✓ 正常スタート</button><button id="fault" class="answer bad">⚑ フライングあり</button></div><div id="laneChoices" class="lanes hidden"></div><div class="notice">映像と音を思い出して、一度だけ判定してください。</div></div></section>
<section id="feedback" class="screen hidden"><div class="resultbox"><div id="feedbackIcon" style="font-size:3rem">✓</div><h1 id="feedbackTitle">正解！</h1><p id="feedbackText"></p><button class="gold" id="continue">次の組へ →</button></div></section>
<section id="end" class="screen hidden"><div class="resultbox"><div style="font-size:2.8rem">🏁</div><h1 id="endTitle">GAME OVER</h1><p id="endText"></p><button class="gold" id="again">タイトルに戻る</button></div></section>
</div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let mode='normal',heat=1,correct=0,scenario=null,state='menu',audioOn=true,ac=null,animId=0,watchToken=0;const max=30;
const colors=['#f7cf74','#76d6d4','#ec8e86','#b1a3ef','#ecedf4','#ffaf6e','#75a6ed','#da8cae'];
function fit(canvas){let rect=canvas.getBoundingClientRect();if(canvas.id==='track'){let ratio=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(rect.width*ratio));canvas.height=Math.max(1,Math.round(rect.height*ratio))}};
function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function athlete(ctx,x,y,scale,color,progress=0){ctx.save();ctx.translate(x+progress*135,y);ctx.scale(scale,scale);let kick=progress>0?Math.sin(progress*13)*9:0;ctx.lineCap='round';ctx.lineJoin='round';ctx.fillStyle='#27343c';ctx.fillRect(-33,7,25,5);ctx.fillRect(-8,7,22,5);ctx.strokeStyle='#e8b99a';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(-20-kick,6);ctx.lineTo(-29-kick,9);ctx.moveTo(0,-6);ctx.lineTo(16+kick,4);ctx.lineTo(23+kick,10);ctx.stroke();ctx.strokeStyle='#e8edf2';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-29-kick,9);ctx.lineTo(-20-kick,9);ctx.moveTo(23+kick,10);ctx.lineTo(32+kick,10);ctx.stroke();ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-11,-22);ctx.lineTo(4,-25);ctx.lineTo(13,-12);ctx.lineTo(2,-5);ctx.lineTo(-7,-8);ctx.closePath();ctx.fill();ctx.strokeStyle='#e8b99a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(2,-22);ctx.lineTo(18+kick*.3,-14);ctx.lineTo(14+kick*.5,-4);ctx.moveTo(-7,-19);ctx.lineTo(-17-kick*.3,-11);ctx.lineTo(-12-kick*.5,-3);ctx.stroke();ctx.fillStyle='#e6b695';ctx.beginPath();ctx.arc(-5,-32,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#29343c';ctx.beginPath();ctx.arc(-6,-35,8,Math.PI,Math.PI*2);ctx.fill();ctx.restore()}
function stadium(ctx,w,h,positions=null){let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#86c4e9');sky.addColorStop(.4,'#bddfee');sky.addColorStop(.401,'#436574');sky.addColorStop(1,'#162c3b');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);ctx.fillStyle='#d2e8f4';for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse((i+.3)*w/4,h*.12+(i%2)*22,50,16,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#3d606b';ctx.fillRect(0,h*.27,w,h*.13);ctx.fillStyle='#263c50';ctx.fillRect(0,h*.4,w,h*.09);for(let i=0;i<220;i++){let x=(i*73)%w,y=h*.28+(i*31)%(h*.18);ctx.fillStyle=['#97b8bf','#ddc18c','#d88983','#7ba8a2'][i%4];ctx.fillRect(x,y,4,3)}let top=h*.5,laneH=(h*.47)/8;for(let i=0;i<8;i++){let y=top+i*laneH;ctx.fillStyle=i%2?'#a84743':'#b9544a';ctx.fillRect(0,y,w,laneH);ctx.strokeStyle='#eac5b8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,y+laneH);ctx.lineTo(w,y+laneH);ctx.stroke();ctx.fillStyle='#e9e9e5';ctx.font=`bold ${Math.max(13,laneH*.42)}px system-ui`;ctx.fillText(String(i+1),14,y+laneH*.68);let p=positions?positions[i]:0;athlete(ctx,w*.32+(i%2)*5,y+laneH*.62,Math.min(1.25,laneH/34),colors[i],p)}ctx.strokeStyle='#f5f7f8';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(w*.75,top);ctx.lineTo(w*.75,top+laneH*8);ctx.stroke()}
function background(){let c=$('track');fit(c);let ctx=c.getContext('2d');stadium(ctx,c.width,c.height);}
function show(id){for(const name of ['menu','game','feedback','end'])$(name).classList.toggle('hidden',name!==id);$('app').classList.toggle('playing',id==='game');state=id;}
function pick(modeName){mode=modeName;$('normal').classList.toggle('selected',mode==='normal');$('hard').classList.toggle('selected',mode==='hard')}
function tone(freq,dur=.13){if(!audioOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;o.type='triangle';g.gain.setValueAtTime(.17,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch(e){}}
function gun(){if(!audioOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let n=Math.floor(ac.sampleRate*.22),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);let s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.value=.7;s.connect(g);g.connect(ac.destination);s.start()}catch(e){tone(190,.15)}}
function say(text){if(!audioOn||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;u.volume=.85;speechSynthesis.speak(u)}catch(e){}}
function newScenario(){let early=Math.random()<.48;scenario={early,lane:Math.floor(Math.random()*8)+1,earlyBy:.18+Math.random()*.23,delays:Array.from({length:8},()=>.14+Math.random()*.15)};}
function paint(progresses){const c=$('race'),ctx=c.getContext('2d');stadium(ctx,c.width,c.height,progresses)}
function initHeat(){watchToken++;cancelAnimationFrame(animId);newScenario();show('game');$('heat').textContent=`${heat}組目 / ${max}`;$('difficulty').textContent=mode.toUpperCase();$('racePrompt').textContent='スタートの準備ができました';$('racePrompt').classList.remove('hidden');$('decisionLayer').classList.add('hidden');$('answers').classList.remove('hidden');$('prompt').textContent='あなたの判定は？';$('watch').classList.remove('hidden');$('watch').disabled=false;$('laneChoices').classList.add('hidden');paint(Array(8).fill(0));}
function watch(){let token=++watchToken;$('watch').disabled=true;$('watch').classList.add('hidden');$('racePrompt').textContent='On your marks…';say('On your marks');let start=performance.now(),firedSet=false,firedGun=false;function loop(now){if(token!==watchToken)return;let t=(now-start)/1000;let pos=Array(8).fill(0);if(t>1.35&&t<2.75){$('racePrompt').textContent='Set…';if(!firedSet){firedSet=true;say('Set')}}if(t>=2.75&&!firedGun){firedGun=true;gun()}if(t>=2.75){let since=t-2.75;for(let i=0;i<8;i++){let begin=(scenario.early&&i+1===scenario.lane)?-scenario.earlyBy:scenario.delays[i];pos[i]=Math.max(0,Math.min(1.8,(since-begin)*1.7))}}else if(scenario.early&&t>2.75-scenario.earlyBy){pos[scenario.lane-1]=Math.max(0,Math.min(1.8,(t-(2.75-scenario.earlyBy))*1.7))}paint(pos);if(t<4.7)animId=requestAnimationFrame(loop);else{$('racePrompt').classList.add('hidden');$('decisionLayer').classList.remove('hidden');$('answers').classList.remove('hidden')}}animId=requestAnimationFrame(loop);}
function answer(isFault,lane){if(state!=='game')return;if(isFault&&mode==='hard'&&lane===undefined){$('answers').classList.add('hidden');$('prompt').textContent='フライングしたレーンを選択';$('laneChoices').classList.remove('hidden');return}let win=scenario.early?(isFault&&(mode==='normal'||lane===scenario.lane)):!isFault;if(win)correct++;$('feedbackIcon').textContent=win?'✓':'✕';$('feedbackIcon').style.color=win?'#6be7bc':'#ff9999';$('feedbackTitle').textContent=win?'正解！':'判定ミス';$('feedbackText').textContent=win?`${heat}組目の判定に成功！\n${correct}組連続正解中。`:`正解：${scenario.early?`フライングあり（${scenario.lane}レーン）`:'正常スタート'}。\n${correct}組連続正解で終了。`;show('feedback');$('continue').textContent=win?(heat===max?'大会結果を見る →':'次の組へ →'):'結果を見る →';$('continue').onclick=()=>{if(!win||heat===max){finish(win&&heat===max)}else{heat++;initHeat()}};}
function finish(perfect){show('end');$('endTitle').textContent=perfect?'PERFECT CLEAR!':'GAME OVER';$('endText').textContent=perfect?`30組すべてのスタートを正しく判定しました！\n${mode.toUpperCase()} MODE 完全制覇！`:`${heat}組目で判定ミス。\n${correct}組連続正解！\n難易度：${mode.toUpperCase()}`;}
$('normal').onclick=()=>pick('normal');$('hard').onclick=()=>pick('hard');$('go').onclick=()=>{heat=1;correct=0;initHeat()};$('watch').onclick=watch;$('clean').onclick=()=>answer(false);$('fault').onclick=()=>answer(true);$('again').onclick=()=>{watchToken++;show('menu')};for(let i=1;i<=8;i++){let b=document.createElement('button');b.className='lane';b.textContent=i+'レーン';b.onclick=()=>answer(true,i);$('laneChoices').appendChild(b)}function soundToggle(){audioOn=!audioOn;$('soundMenu').textContent=audioOn?'🔊 音 ON':'🔇 音 OFF';$('soundGame').textContent=audioOn?'🔊':'🔇';if(audioOn)tone(750)}$('soundMenu').onclick=soundToggle;$('soundGame').onclick=soundToggle;window.addEventListener('resize',background);background();
})();
</script></body></html>
