er;justify-content:space-between;gap:8px}.pill{background:#102b40c9;border:1px solid #ffffff40;border-radius:12px;padding:10px 14px;font-weight:800}#app.playing #veil{display:none}.game{position:absolute;inset:0;min-height:100dvh;padding:0;display:block;background:transparent}.game .top{position:absolute;z-index:5;top:calc(12px + env(safe-area-inset-top));left:12px;width:calc(100% - 24px)}.game .video{position:absolute;inset:0;width:100%;height:100%;max-width:none;border:0;border-radius:0;box-shadow:none}.game .video canvas{width:100%;height:100%;object-fit:cover}.game .banner{position:absolute;z-index:5;top:calc(75px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(90%,500px)}.game #watch{position:absolute;z-index:5;bottom:calc(12% + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%)}.game .notice{display:none}.decision-overlay{position:absolute;inset:0;z-index:6;background:#071b30a6;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;padding:24px 18px}.decision-overlay .banner{position:static;transform:none;width:min(100%,540px);font-size:1.25rem}.decision-overlay .actions{width:min(100%,540px)}.decision-overlay .lanes{width:min(100%,540px)}.game #decisionLayer.hidden{display:none!important}.sound-warning{background:#fff0ba;color:#493408;border-radius:12px;padding:11px 16px;text-align:center;font-weight:900;font-size:.95rem}.video{width:100%;position:relative;border:2px solid #64869a;border-radius:13px;overflow:hidden;box-shadow:0 12px 30px #0005}.video canvas{width:100%;display:block;background:#30495a}.banner{background:#091d2ae0;border:1px solid #46677c;padding:12px 14px;border-radius:12px;text-align:center;width:100%;font-weight:700}.actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{border:2px solid #668aa1;background:#1a3b51;color:#fff;border-radius:13px;padding:16px 6px;font-weight:850;min-height:62 function athlete(ctx,x,y,scale,color,progress=0,t=0){
 ctx.save();ctx.translate(x+progress*135,y);ctx.scale(scale,scale);ctx.lineCap='round';ctx.lineJoin='round';
 const clamp=v=>Math.max(0,Math.min(1,v)),ease=v=>{v=clamp(v);return v*v*(3-2*v)},mix=(a,b,k)=>a+(b-a)*k;
 const pt=(a,b,k)=>[mix(a[0],b[0],k),mix(a[1],b[1],k)];
 const stroke=(pts,c,w)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(...pts[0]);for(let j=1;j<pts.length;j++)ctx.lineTo(...pts[j]);ctx.stroke()};
 const skin='#d7a17e',shoe='#f1f6f9';
 // The first two phases are held on the track: hands never slide during SET.
 const set=ease((t-4.98)/.65),drive=ease(progress*6.5),upright=ease((progress-.14)*2.7);
 const stride=Math.sin(progress*16),kick=ease(progress*9);
 const marks={hip:[-22,-20],shoulder:[9,-29],head:[23,-38],backKnee:[-37,-7],frontKnee:[-5,-9],backFoot:[-43,7],frontFoot:[-11,7]};
 const ready={hip:[-24,-48],shoulder:[12,-38],head:[26,-48],backKnee:[-38,-17],frontKnee:[-4,-21],backFoot:[-43,7],frontFoot:[-11,7]};
 const push={hip:[-10,-39],shoulder:[21,-55],head:[31,-65],backKnee:[-34,-16],frontKnee:[13,-25],backFoot:[-48,5],frontFoot:[26,4]};
 const run={hip:[-3,-35],shoulder:[2,-70],head:[8,-83],backKnee:[-16+stride*12,-13],frontKnee:[14-stride*12,-16],backFoot:[-24+stride*23,7-Math.max(0,stride)*14],frontFoot:[21-stride*23,7-Math.max(0,-stride)*14]};
 const pose={};for(const k in marks){let v=pt(marks[k],ready[k],set);v=pt(v,push[k],drive);pose[k]=pt(v,run[k],upright)}

 // Back leg is behind the body; front leg drives off the front block.
 stroke([hip,backKnee,backFoot],skin,7);stroke([hip,frontKnee,frontFoot],skin,7);

 const handFar=[30,8],handNear=[6,8];

 const swing=stride*14;

 const armFront=[shoulder,[shoulder[0]+14+swing*.45,shoulder[1]+15],[shoulder[0]+23+swing*.7,shoulder[1]+7]];
 const far=[shoulder,pt(farElbow,armRear[1],kick),pt(handFar,armRear[2],kick)];

 }ctx.globalAlpha=1}

function stadium(ctx,w,h,positions=null,t=0){let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#86c4e9');sky.addColorStop(.4,'#bddfee');sky.addColorStop(.401,'#436574');sky.addColorStop(1,'#162c3b');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);ctx.fillStyle='#d2e8f4';for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse((i+.3)*w/4,h*.12+(i%2)*22,50,16,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#3d606b';ctx.fillRect(0,h*.27,w,h*.13);ctx.fillStyle='#263c50';ctx.fillRect(0,h*.4,w,h*.09);for(let i=0;i<220;i++){let x=(i*73)%w,y=h*.28+(i*31)%(h*.18);ctx.fillStyle=['#97b8bf','#ddc18c','#d88983','#7ba8a2'][i%4];ctx.fillRect(x,y,4,3)}let top=h*.5,laneH=(h*.47)/8;for(let i=0;i<8;i++){let y=top+i*laneH;ctx.fillStyle=i%2?'#a84743':'#b9544a';ctx.fillRect(0,y,w,laneH);ctx.strokeStyle='#eac5b8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,y+laneH);ctx.lineTo(w,y+laneH);ctx.stroke();ctx.fillStyle='#e9e9e5';ctx.font=`bold ${Math.max(13,laneH*.42)}px system-ui`;ctx.fillText(String(i+1),14,y+laneH*.68);let p=positions?positions[i]:0;let ax=w*.32+(i%2)*5,ay=y+laneH*.62,sc=Math.min(1.25,laneH/34);ctx.save();ctx.translate(ax,ay);ctx.scale(sc,sc);ctx.fillStyle="#34454c";ctx.fillRect(-51,8,53,5);ctx.fillStyle="#a3bac3";for(const bx of [-40,-9]){ctx.save();ctx.translate(bx,6);ctx.rotate(-.30);ctx.fillRect(-4,-10,8,14);ctx.restore()}ctx.restore();athlete(ctx,ax,ay,sc,colors[i],p,t)}ctx.strokeStyle='#f5f7f8';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(w*.32+Math.min(1.25,laneH/34)*36,top);ctx.lineTo(w*.32+Math.min(1.25,laneH/34)*36,top+laneH*8);ctx.stroke()}

function newScenario(){
 // Every heat is independent. On some false-start heats, two or three lanes jump.
 const early=Math.random()<.5;
 const count=early?(Math.random()<.27?(Math.random()<.72?2:3):1):0;
 const shuffled=Array.from({length:8},(_,i)=>i+1);
 for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
 const faultLanes=shuffled.slice(0,count);
 const delays=Array.from({length:8},()=>.100+Math.pow(Math.random(),1.50)*.115);
 const speeds=Array.from({length:8},()=>.72+Math.random()*.68);
 const acceleration=Array.from({length:8},()=>.70+Math.random()*.65);
 for(const lane of faultLanes){
   const r=Math.random();
   delays[lane-1]=r<.54 ? (.070+Math.random()*.029) : (r<.87 ? (.008+Math.random()*.062) : (-.125+Math.random()*.133));
   if(Math.random()<.70){speeds[lane-1]=.70+Math.random()*.22;acceleration[lane-1]=.72+Math.random()*.20;}
 }
 scenario={early,faultLanes,delays,speeds,acceleration,audioVariant:Math.floor(Math.random()*START_AUDIOS.length)};
}
function paint(progresses,t=0){const c=$('race'),ctx=c.getContext('2d');stadium(ctx,c.width,c.height,progresses,t)}
function initHeat(){watchToken++;cancelAnimationFrame(animId);newScenario();show('game');$('heat').textContent=`${heat}組目 / ${max}`;$('difficulty').textContent=mode.toUpperCase();$('racePrompt').textContent='スタートの準備ができました';$('racePrompt').classList.remove('hidden');$('decisionLayer').classList.add('hidden');$('answers').classList.remove('hidden');$('prompt').textContent='あなたの判定は？';$('watch').classList.remove('hidden');$('watch').disabled=false;$('laneChoices').classList.add('hidden');paint(Array(8).fill(0));}
function watch(isReplay=false){
 replayMode=isReplay;
 if(isReplay){show('game');$('decisionLayer').classList.add('hidden');$('racePrompt').classList.remove('hidden');$('watch').classList.add('hidden');}
 let token=++watchToken;
 $('watch').disabled=true;$('watch').classList.add('hidden');
 $('racePrompt').textContent='スタートを確認してください';
 // Audio and movement share the same media clock, avoiding independent timer drift.
 if(startAudio){startAudio.pause();startAudio=null;}
 let media=new Audio(START_AUDIOS[scenario.audioVariant]);startAudio=media;media.preload='auto';media.volume=audioOn?1:0;
 const gunAt=GUN_AT+scenario.audioVariant*.20;
 let begun=performance.now(),audioStarted=false,ended=false,freezeAt=0,lastMediaTime=0,endedAt=0;
 const finishVideo=()=>{if(token!==watchToken||ended)return;ended=true;media.pause();$('racePrompt').classList.add('hidden');if(isReplay){show('feedback');}else{$('decisionLayer').classList.remove('hidden');$('answers').classList.remove('hidden');}};
 function loop(now){
   if(token!==watchToken)return;
   let t=audioStarted?media.currentTime:(now-begun)/1000;
   if(media.ended){if(!endedAt){endedAt=now;lastMediaTime=media.currentTime;}t=lastMediaTime+(now-endedAt)/1000;}
   let pos=Array(8).fill(0);
   for(let i=0;i<8;i++){
     const begin=scenario.delays[i];
     const elapsed=Math.max(0,t-gunAt-begin);
     // Independent start acceleration and running speed prevent identifying a fault by who leads.
     pos[i]=3.2*scenario.speeds[i]*(elapsed - (1-Math.exp(-elapsed*6*scenario.acceleration[i]))/(6*scenario.acceleration[i]) + elapsed*.30);
   }
   paint(pos);
   if(t>=gunAt+3.65){finishVideo();return;}
   animId=requestAnimationFrame(loop);
 }
 media.addEventListener('playing',()=>{audioStarted=true;begun=performance.now();});
 media.addEventListener('error',()=>{$('racePrompt').textContent='音声を再生できません。ブラウザで開いてください。';});
 media.play().then(()=>{audioStarted=true;}).catch(()=>{$('racePrompt').textContent='音声が再生できません。Safariで開いてください。';$('watch').classList.remove('hidden');$('watch').disabled=false;watchToken++;});
 animId=requestAnimationFrame(loop);
}
function answer(isFault,lane){if(state!=='game')return;if(isFault&&mode==='hard'&&lane===undefined){$('answers').classList.add('hidden');$('prompt').textContent='フライングしたレーンを選択';$('laneChoices').classList.remove('hidden');return}let win=scenario.early?(isFault&&(mode==='normal'||scenario.faultLanes.includes(lane))):!isFault;if(win)correct++;$('replay').classList.toggle('hidden',win&&!scenario.early);$('feedbackIcon').textContent=win?'✓':'✕';$('feedbackIcon').style.color=win?'#6be7bc':'#ff9999';$('feedbackTitle').textContent=win?'正解！':'判定ミス';const reactionDetails=scenario.early?scenario.faultLanes.slice().sort((a,b)=>a-b).map(l=>`${l}レーン：${scenario.delays[l-1]>=0?'+':''}${scenario.delays[l-1].toFixed(3)}秒`).join('\n'):'なし';$('feedbackText').textContent=`${win?'正解！':'正解：'}${scenario.early?`フライングあり（${scenario.faultLanes.join('・')}レーン）`:'正常スタート'}\n${scenario.early?`リアクションタイム（号砲基準）\n${reactionDetails}\n`:''}${win?`${correct}組連続正解中。`:`${correct}組連続正解で終了。`}`;show('feedback');$('continue').textContent=win?(heat===max?'大会結果を見る →':'次の組へ →'):'結果を見る →';$('continue').onclick=()=>{if(!win||heat===max){finish(win&&heat===max)}else{heat++;initHeat()}};}
function finish(perfect){show('end');$('endTitle').textContent=perfect?'結果：30組 完全制覇！':`結果：${correct}組`;$('endText').textContent=perfect?`30組すべてのスタートを正しく判定しました！\n${mode.toUpperCase()} MODE 完全制覇！`:`${heat}組目で判定ミス。\n${correct}組連続正解！\n難易度：${mode.toUpperCase()}`;}
$('normal').onclick=()=>pick('normal');$('hard').onclick=()=>pick('hard');$('go').onclick=()=>{heat=1;correct=0;initHeat()};$('watch').onclick=()=>watch(false);$('replay').onclick=()=>watch(true);$('clean').onclick=()=>answer(false);$('fault').onclick=()=>answer(true);$('again').onclick=()=>{watchToken++;if(startAudio){startAudio.pause();startAudio=null;}show('menu')};for(let i=1;i<=8;i++){let b=document.createElement('button');b.className='lane';b.textContent=i+'レーン';b.onclick=()=>answer(true,i);$('laneChoices').appendChild(b)}function soundToggle(){audioOn=!audioOn;if(startAudio)startAudio.volume=audioOn?1:0;$('soundMenu').textContent=audioOn?'🔊 音 ON':'🔇 音 OFF';$('soundGame').textContent=audioOn?'🔊':'🔇';if(audioOn)tone(750)}$('soundMenu').onclick=soundToggle;$('soundGame').onclick=soundToggle;window.addEventListener('resize',background);background();
})();
</script></body></html>
